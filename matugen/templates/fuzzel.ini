# ~/.config/fuzzel/fuzzel.ini
# Generated by matugen from the wallpaper - do not edit by hand.

[main]
font=Iosevka NF:size=11
prompt="Scree? "
icon-theme=Papirus
terminal=foot
lines=8
width=30
horizontal-pad=12
vertical-pad=8
inner-pad=6
layer=overlay
dpi-aware=no

[colors]
background={{ colors.surface.default.hex }}f2
text={{ colors.on_surface.default.hex }}ff
prompt={{ colors.primary.default.hex }}ff
placeholder={{ colors.on_surface_variant.default.hex }}ff
input={{ colors.on_surface.default.hex }}ff
match={{ colors.primary.default.hex }}ff
selection={{ colors.primary.default.hex }}ff
selection-text={{ colors.on_primary.default.hex }}ff
selection-match={{ colors.on_primary.default.hex }}ff
counter={{ colors.on_surface_variant.default.hex }}ff
border={{ colors.primary.default.hex }}ff

[border]
width=2
radius=4
selection-radius=2
