# ~/.config/fuzzel/fuzzel.ini
# Breeze Light (KDE palette)

[main]
font=Iosevka NF:size=10
prompt=❯ 
icon-theme=Breeze
terminal=foot
lines=8
width=30
horizontal-pad=12
vertical-pad=8
inner-pad=6
layer=overlay
dpi-aware=no

[colors]
background=eff0f1f2
text=232629ff
prompt=3daee9ff
placeholder=707d8aff
input=232629ff
match=3daee9ff
selection=3daee9ff
selection-text=ffffffff
selection-match=ffffffff
counter=707d8aff
border=3daee9ff

[border]
width=2
radius=4
selection-radius=2
