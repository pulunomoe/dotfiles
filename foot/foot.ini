# ~/.config/foot/foot.ini
#
# Breeze Light color scheme, derived from KDE's BreezeLight.colors
# (https://invent.kde.org/plasma/breeze) and the canonical Breeze flat palette.

[main]
font=Iosevka Nerd Font:size=10
pad=5x5
initial-color-theme=light

[colors-light]
# Backgrounds / foregrounds (KDE [Colors:View])
background=ffffff
foreground=232629

# Normal ANSI colors
regular0=232629
regular1=da4453
regular2=27ae60
regular3=f67400
regular4=3daee9
regular5=9b59b6
regular6=1abc9c
regular7=eff0f1

# Bright ANSI colors
bright0=7f8c8d
bright1=e74c3c
bright2=2ecc71
bright3=f39c12
bright4=2980b9
bright5=bf6bd0
bright6=16a085
bright7=ffffff

# Text selection (KDE [Colors:Selection])
selection-foreground=ffffff
selection-background=3daee9
